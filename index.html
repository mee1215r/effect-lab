<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effect Lab</title>
<style>
  :root{--bg:#0e0f13;--panel:#16181f;--line:#262a35;--text:#eae7df;--sub:#8d909b;--accent:#f0b37e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
  header{max-width:1200px;margin:0 auto;padding:40px 20px 16px}
  h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:.04em;font-weight:600}
  h1 span{color:var(--accent)}
  .lead{color:var(--sub);margin:8px 0 20px;font-size:14px}
  .switch{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .switch button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}
  .switch button:hover{border-color:var(--accent)}
  #count{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px;min-width:90px;text-align:center}
  #note{color:var(--accent);font-size:12px;margin-top:10px;min-height:1.2em}
  main{max-width:1200px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .card canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;background:#000}
  .meta{padding:14px 16px 16px}
  .meta h2{margin:0;font-size:16px;font-weight:600}
  .meta h2 em{font-style:normal;color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
  .meta p{margin:4px 0 12px;color:var(--sub);font-size:13px}
  .ctl{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
  .ctl input{flex:1;accent-color:var(--accent)}
  .ctl output{min-width:2.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .fallback{aspect-ratio:4/5;display:grid;place-items:center;color:var(--sub);font-size:13px;padding:20px;text-align:center}
  footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Effect <span>Lab</span></h1>
  <p class="lead">写真にエフェクトをかけて遊ぶ実験場。スライダーを動かしたり、画像の上でマウスを動かしてみてください。</p>
  <div class="switch">
    <button id="prev" aria-label="前の写真">‹</button>
    <span id="count"></span>
    <button id="next" aria-label="次の写真">›</button>
  </div>
  <div id="note"></div>
</header>
<main id="grid"></main>
<footer>© Effect Lab</footer>

<script>
/* ============================================================
   ① 写真の設定
   photos/ フォルダに写真を入れて、ここにパスを書くだけで差し替わります。
   例: const PHOTOS = ['photos/01.jpg','photos/02.jpg','photos/03.jpg'];
   空のままだと、サンプル画像(自動生成)が表示されます。
   ============================================================ */
const PHOTOS = [
  'photos/01.jpg','photos/02.jpg','photos/03.jpg','photos/04.jpg','photos/05.jpg',
];

const W = 640, H = 800;
const state = { idx: 0, covers: [], samples: false };
const onChange = [];

/* ---------- 画像の読み込み ---------- */
function loadImage(url){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = url;
  });
}
function drawCover(ctx, src, w, h){
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const s = Math.max(w / sw, h / sh);
  const dw = sw * s, dh = sh * s;
  ctx.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
}
function toCover(src){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  drawCover(c.getContext('2d'), src, W, H);
  return c;
}
function makeSample(i){
  const c = document.createElement('canvas');
  c.width = 1000; c.height = 1250;
  const g = c.getContext('2d');
  const pal = [
    ['#1b2a49', '#e86a5c', '#f6c177'],
    ['#0f3d3e', '#6bbf9b', '#f2e8cf'],
    ['#2b1b3d', '#c36bd8', '#ffd1a1']
  ][i % 3];
  const gr = g.createLinearGradient(0, 0, 0, 1250);
  gr.addColorStop(0, pal[0]); gr.addColorStop(.6, pal[1]); gr.addColorStop(1, pal[2]);
  g.fillStyle = gr; g.fillRect(0, 0, 1000, 1250);
  g.fillStyle = pal[2];
  g.beginPath(); g.arc(650, 620, 110, 0, Math.PI * 2); g.fill();
  for (let l = 0; l < 5; l++){
    const base = 760 + l * 110;
    g.fillStyle = `rgba(10,15,25,${0.25 + l * 0.17})`;
    g.beginPath(); g.moveTo(0, 1250);
    for (let x = 0; x <= 1000; x += 10){
      g.lineTo(x, base + Math.sin(x / (110 + l * 30) + i * 2 + l) * (40 + l * 8));
    }
    g.lineTo(1000, 1250); g.fill();
  }
  return c;
}
const getCover = () => state.covers[state.idx];

/* ---------- カード生成 ---------- */
function addCard(cfg){
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `
    <canvas width="${W}" height="${H}"></canvas>
    <div class="meta">
      <h2><em>${cfg.no}</em>${cfg.title}</h2>
      <p>${cfg.desc}</p>
      <label class="ctl"><span>${cfg.label}</span>
        <input type="range" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${cfg.val}">
        <output>${cfg.val}</output></label>
    </div>`;
  document.getElementById('grid').appendChild(card);

  const canvas = card.querySelector('canvas');
  const slider = card.querySelector('input');
  const out = card.querySelector('output');
  const fx = cfg.make(canvas);
  if (!fx){
    canvas.outerHTML = '<div class="fallback">このブラウザでは WebGL が使えないため、表示できません。</div>';
    return;
  }

  const ctl = { value: +cfg.val, mx: .5, my: .5, sx: .5, sy: .5 };
  let visible = false, dirty = true;

  slider.addEventListener('input', () => { ctl.value = +slider.value; out.textContent = slider.value; dirty = true; });
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    ctl.mx = (e.clientX - r.left) / r.width;
    ctl.my = (e.clientY - r.top) / r.height;
  });
  canvas.addEventListener('pointerleave', () => { ctl.mx = .5; ctl.my = .5; });
  new IntersectionObserver(e => { visible = e[0].isIntersecting; if (visible) dirty = true; }).observe(canvas);
  onChange.push(() => { dirty = true; });

  (function frame(t){
    requestAnimationFrame(frame);
    if (!visible) return;
    ctl.sx += (ctl.mx - ctl.sx) * .08;
    ctl.sy += (ctl.my - ctl.sy) * .08;
    if (fx.animated || dirty){ fx.draw(t / 1000, ctl); dirty = false; }
  })(0);
}

/* ============================================================
   ② エフェクト
   ============================================================ */

/* --- 01 Dither(2階調のドット絵風) --- */
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
function ditherFx(canvas){
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  const ink = [18, 20, 28], paper = [238, 232, 218];
  return { animated: false, draw(t, ctl){
    const px = Math.round(ctl.value);
    const w = Math.floor(W / px), h = Math.floor(H / px);
    off.width = w; off.height = h;
    octx.drawImage(getCover(), 0, 0, w, h);
    const d = octx.getImageData(0, 0, w, h), a = d.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      const l = (a[i] * .299 + a[i+1] * .587 + a[i+2] * .114) / 255;
      const th = (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16;
      const c = l > th ? paper : ink;
      a[i] = c[0]; a[i+1] = c[1]; a[i+2] = c[2]; a[i+3] = 255;
    }
    octx.putImageData(d, 0, 0);
    ctx.fillStyle = `rgb(${ink})`; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, w, h, 0, 0, w * px, h * px);
  }};
}

/* --- 02 ASCII(文字で描く) --- */
function asciiFx(canvas){
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  const chars = ' .:-=+*#%@';
  return { animated: false, draw(t, ctl){
    const cell = Math.round(ctl.value);
    const ch = cell * 1.8;
    const cols = Math.floor(W / cell), rows = Math.floor(H / ch);
    off.width = cols; off.height = rows;
    octx.drawImage(getCover(), 0, 0, cols, rows);
    const a = octx.getImageData(0, 0, cols, rows).data;
    ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, W, H);
    ctx.font = `${cell * 1.6}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
      const i = (y * cols + x) * 4;
      const l = (a[i] * .299 + a[i+1] * .587 + a[i+2] * .114) / 255;
      const c = chars[Math.min(9, Math.floor(l * 10))];
      if (c === ' ') continue;
      ctx.fillStyle = `rgb(${Math.min(255, a[i] * 1.4)},${Math.min(255, a[i+1] * 1.4)},${Math.min(255, a[i+2] * 1.4)})`;
      ctx.fillText(c, x * cell, y * ch);
    }
  }};
}

/* --- WebGL 共通部品 --- */
const VS = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0., 1.); }`;
const HEAD = `precision mediump float; varying vec2 uv;
uniform sampler2D uTex; uniform float uTime, uAmt; uniform vec2 uMouse, uRes;`;

function glFx(canvas, body){
  const gl = canvas.getContext('webgl', { antialias: false });
  if (!gl) return null;
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, HEAD + body));
  gl.linkProgram(pr); gl.useProgram(pr);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  const U = n => gl.getUniformLocation(pr, n);
  let uploaded = null;
  return { animated: true, draw(t, ctl){
    const cov = getCover();
    if (uploaded !== cov){
      try {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cov);
        uploaded = cov;
      } catch (e){
        document.getElementById('note').textContent =
          '写真を読み込めませんでした。ファイルを直接開かず、GitHub Pages か、ローカルサーバー経由で開いてください。';
        return;
      }
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(U('uTime'), t);
    gl.uniform1f(U('uAmt'), ctl.value);
    gl.uniform2f(U('uMouse'), ctl.sx, ctl.sy);
    gl.uniform2f(U('uRes'), W, H);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }};
}

/* --- 03 Ripple(マウスの位置から波紋) --- */
const RIPPLE = `
void main(){
  vec2 d = uv - uMouse; d.x *= uRes.x / uRes.y;
  float r = length(d);
  float wave = sin(r * 40. - uTime * 4.) * exp(-r * 5.);
  vec2 dir = normalize(d + 1e-4);
  vec2 p = uv + dir * wave * uAmt * .012;
  p += vec2(sin(uv.y * 14. + uTime), cos(uv.x * 14. + uTime * .8)) * .0015;
  gl_FragColor = texture2D(uTex, p);
}`;

/* --- 04 Gradient Map(明るさをグラデーションに置き換え) --- */
const GRADIENT = `
vec3 pal(float t){
  return .5 + .5 * cos(6.28318 * (vec3(1., 1., .5) * t + vec3(.8, .9, .3)));
}
void main(){
  vec3 c = texture2D(uTex, uv).rgb;
  float l = dot(c, vec3(.299, .587, .114));
  float flow = sin(uv.x * 3. + uTime * uAmt * .3) * .15 + cos(uv.y * 4. - uTime * uAmt * .25) * .15;
  vec3 g = pal(l * .9 + flow + uTime * .02 * uAmt + uMouse.x * .5);
  g *= .45 + l * 1.1;
  gl_FragColor = vec4(mix(c, g, .85), 1.);
}`;

/* --- 05 RGB Split / Glitch(色ずれ + ノイズ) --- */
const GLITCH = `
float h(float x){ return fract(sin(x * 127.1) * 43758.5453); }
void main(){
  float amt = uAmt * .004;
  vec2 off = (uMouse - .5) * uAmt * .02;
  float band = floor(uv.y * 24.);
  float t = floor(uTime * 8.);
  float g = step(.93, h(band + t * 7.)) * (h(band * 3. + t) - .5) * uAmt * .04;
  vec2 p = uv + vec2(g, 0.);
  float r = texture2D(uTex, p + vec2(amt, 0.) + off).r;
  float gg = texture2D(uTex, p).g;
  float b = texture2D(uTex, p - vec2(amt, 0.) - off).b;
  gl_FragColor = vec4(r, gg, b, 1.);
}`;

/* --- 06 Halftone(網点) --- */
function halftoneFx(canvas){
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  return { animated: false, draw(t, ctl){
    const s = Math.round(ctl.value);
    const cols = Math.floor(W / s), rows = Math.floor(H / s);
    off.width = cols; off.height = rows;
    octx.drawImage(getCover(), 0, 0, cols, rows);
    const a = octx.getImageData(0, 0, cols, rows).data;
    ctx.fillStyle = '#0d0e12'; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
      const i = (y * cols + x) * 4;
      const l = (a[i] * .299 + a[i+1] * .587 + a[i+2] * .114) / 255;
      const r = Math.sqrt(l) * s * .55;
      if (r < .4) continue;
      ctx.fillStyle = `rgb(${Math.min(255, a[i] * 1.25)},${Math.min(255, a[i+1] * 1.25)},${Math.min(255, a[i+2] * 1.25)})`;
      ctx.beginPath();
      ctx.arc(x * s + s / 2, y * s + s / 2, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }};
}

/* --- 07 Liquid Warp(水面のようにゆらぐ) --- */
const WARP = `
void main(){
  vec2 p = uv;
  float s = uAmt * .004;
  float k = .5 + uMouse.x;
  p.x += (sin(p.y * 10. + uTime * 1.5) * s + sin(p.y * 23. - uTime * 2.1) * s * .5) * k;
  p.y += cos(p.x * 9. + uTime * 1.2) * s;
  gl_FragColor = texture2D(uTex, p);
}`;

/* --- 08 Pixel Lens(マウスの周りだけモザイク) --- */
const PIXELLENS = `
void main(){
  vec2 d = uv - uMouse; d.x *= uRes.x / uRes.y;
  float k = smoothstep(.35, .0, length(d));
  float cells = mix(uRes.x, uAmt, k);
  vec2 g = vec2(cells, cells * uRes.y / uRes.x);
  vec2 p = (floor(uv * g) + .5) / g;
  gl_FragColor = texture2D(uTex, p);
}`;

/* ============================================================
   ③ カードの並び(増やしたいときはここに追加)
   ============================================================ */
const CARDS = [
  { no:'01', title:'Dither',      desc:'写真を2色のドットだけで表現します。',               label:'ドット',   min:2, max:10, step:1,   val:4, make: c => ditherFx(c) },
  { no:'02', title:'ASCII',       desc:'明るさを文字の濃さに置き換えます。',                 label:'文字サイズ', min:5, max:14, step:1,   val:8, make: c => asciiFx(c) },
  { no:'03', title:'Ripple',      desc:'画像の上でマウスを動かすと、波紋が広がります。',     label:'強さ',     min:0, max:10, step:.5,  val:5, make: c => glFx(c, RIPPLE) },
  { no:'04', title:'Gradient Map',desc:'写真の明るさを、流れるグラデーションに染めます。',   label:'速さ',     min:0, max:5,  step:.5,  val:2, make: c => glFx(c, GRADIENT) },
  { no:'05', title:'RGB Glitch',  desc:'色をずらして、ときどきノイズが走ります。',           label:'強さ',     min:0, max:10, step:.5,  val:4, make: c => glFx(c, GLITCH) },
  { no:'06', title:'Halftone',    desc:'明るさを、網点の大きさで表現します。',               label:'網点サイズ', min:6, max:24, step:1,   val:12, make: c => halftoneFx(c) },
  { no:'07', title:'Liquid Warp', desc:'写真が水面のようにゆらぎます。マウスの横位置で揺れ方が変わります。', label:'ゆらぎ', min:0, max:10, step:.5, val:5, make: c => glFx(c, WARP) },
  { no:'08', title:'Pixel Lens',  desc:'マウスの周りだけが、モザイクになります。',           label:'ブロック数', min:20, max:120, step:5, val:50, make: c => glFx(c, PIXELLENS) }
];

/* ============================================================
   ④ 起動
   ============================================================ */
(async function init(){
  const imgs = (await Promise.all(PHOTOS.map(loadImage))).filter(Boolean);
  if (imgs.length){
    state.covers = imgs.map(toCover);
  } else {
    state.samples = true;
    state.covers = [0, 1, 2].map(i => toCover(makeSample(i)));
    document.getElementById('note').textContent =
      'サンプル画像を表示中です。photos フォルダに写真を入れ、PHOTOS にパスを書くと差し替わります。';
  }
  CARDS.forEach(addCard);

  const count = document.getElementById('count');
  const update = () => {
    count.textContent = `photo ${state.idx + 1} / ${state.covers.length}`;
    onChange.forEach(f => f());
  };
  const step = d => { state.idx = (state.idx + d + state.covers.length) % state.covers.length; update(); };
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  update();
})();
</script>
</body>
</html>
