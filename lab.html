<style>

  /* ベタ焼き */

  .board{position:relative;background:var(--board);padding:clamp(18px,3vw,32px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(14px,2.4vw,28px) clamp(10px,1.6vw,20px)}

<script>
/* ============================================================
   写真の設定
   photos/ に入れた写真と、タイトルを書きます。
   note に、撮った場所や日のひとことを書くと、ステージの下に出ます。
   ============================================================ */
const PHOTOS = [
  { src:'photos/01.jpg', title:'夕空の白い花',         note:'', alt:'夕方の紫がかった空を背景に、白い小さな花が房になって咲く木の枝' },
  { src:'photos/02.jpg', title:'青空とオレンジのバラ', note:'', alt:'青空を背景に咲く、オレンジ色から赤色のバラ' },
  { src:'photos/03.jpg', title:'ピンクのバラとつぼみ', note:'', alt:'葉の間に咲く淡いピンクのバラと、その隣のつぼみ' },
  { src:'photos/04.jpg', title:'しおれかけの紫のバラ', note:'', alt:'下から見上げた、紫のバラとしおれかけたバラ。奥に青空と雲' },
  { src:'photos/05.jpg', title:'夕暮れの白いバラ',     note:'', alt:'青みがかった夕暮れの光の中で咲く白いバラ。左奥に赤いバラ' }
];

const W = 1200, H = 800;
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let photos = [];
let photoIdx = 0;

/* ---------- 画像の読み込み ---------- */
function loadImage(url){
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
}
function drawCover(ctx, src, w, h){
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const s = Math.max(w / sw, h / sh), dw = sw * s, dh = sh * s;
  ctx.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
}
function toCover(src){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  drawCover(c.getContext('2d'), src, W, H); return c;
}
function makeSample(i){
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800;
  const g = c.getContext('2d');
  const pal = [['#1b2a49','#e86a5c','#f6c177'],['#0f3d3e','#6bbf9b','#f2e8cf'],['#2b1b3d','#c36bd8','#ffd1a1']][i % 3];
  const gr = g.createLinearGradient(0,0,0,800);
  gr.addColorStop(0,pal[0]); gr.addColorStop(.6,pal[1]); gr.addColorStop(1,pal[2]);
  g.fillStyle = gr; g.fillRect(0,0,1200,800);
  g.fillStyle = pal[2]; g.beginPath(); g.arc(780,380,90,0,Math.PI*2); g.fill();
  for (let l = 0; l < 5; l++){
    const base = 460 + l * 70;
    g.fillStyle = `rgba(10,15,25,${.25 + l * .17})`;
    g.beginPath(); g.moveTo(0,800);
    for (let x = 0; x <= 1200; x += 10) g.lineTo(x, base + Math.sin(x/(130+l*30) + i*2 + l) * (30 + l*7));
    g.lineTo(1200,800); g.fill();
  }
  return c;
}
async function loadPhotos(){
  const res = await Promise.all(PHOTOS.map(async p => {
    const img = await loadImage(p.src);
    return img ? { ...p, img, cover: toCover(img) } : null;
  }));
  photos = res.filter(Boolean);
  if (!photos.length){
    photos = [0,1,2].map(i => ({ title:'サンプル ' + (i+1), note:'', alt:'自動生成したサンプル画像', cover: toCover(makeSample(i)), sample:true }));
    $('note').textContent = 'サンプル画像を表示しています。photos フォルダの写真が読み込めませんでした。';
  }
}
const cover = () => photos[photoIdx].cover;

/* ============================================================
   エフェクト
   ============================================================ */
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
const INK = [18,18,18], PAPER = [244,244,240];

const fx2d = $('fx2d').getContext('2d');
const scratch = document.createElement('canvas');
const sctx = scratch.getContext('2d', { willReadFrequently:true });

function drawDither(v){
  const px = Math.round(v), w = Math.floor(W/px), h = Math.floor(H/px);
  scratch.width = w; scratch.height = h;
  sctx.drawImage(cover(),0,0,w,h);
  const d = sctx.getImageData(0,0,w,h), a = d.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = (y*w + x)*4;
    const l = (a[i]*.299 + a[i+1]*.587 + a[i+2]*.114)/255;
    const c = l > (BAYER[(y&3)*4 + (x&3)] + .5)/16 ? PAPER : INK;
    a[i]=c[0]; a[i+1]=c[1]; a[i+2]=c[2]; a[i+3]=255;
  }
  sctx.putImageData(d,0,0);
  fx2d.fillStyle = `rgb(${INK})`; fx2d.fillRect(0,0,W,H);
  fx2d.imageSmoothingEnabled = false;
  fx2d.drawImage(scratch,0,0,w,h,0,0,w*px,h*px);
}
function drawAscii(v){
  const cell = Math.round(v), ch = cell * 1.8, chars = ' .:-=+*#%@';
  const cols = Math.floor(W/cell), rows = Math.floor(H/ch);
  scratch.width = cols; scratch.height = rows;
  sctx.drawImage(cover(),0,0,cols,rows);
  const a = sctx.getImageData(0,0,cols,rows).data;
  fx2d.fillStyle = `rgb(${INK})`; fx2d.fillRect(0,0,W,H);
  fx2d.font = `${cell*1.6}px ui-monospace,Menlo,Consolas,monospace`;
  fx2d.textBaseline = 'top';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const i = (y*cols + x)*4;
    const l = Math.pow((a[i]*.299 + a[i+1]*.587 + a[i+2]*.114)/255, .75);
    const c = chars[Math.min(9, Math.floor(l*10))];
    if (c === ' ') continue;
    fx2d.fillStyle = `rgb(${Math.min(255,a[i]*1.5)},${Math.min(255,a[i+1]*1.5)},${Math.min(255,a[i+2]*1.5)})`;
    fx2d.fillText(c, x*cell, y*ch);
  }
}
function drawHalftone(v){
  const s = Math.round(v), cols = Math.floor(W/s), rows = Math.floor(H/s);
  scratch.width = cols; scratch.height = rows;
  sctx.drawImage(cover(),0,0,cols,rows);
  const a = sctx.getImageData(0,0,cols,rows).data;
  fx2d.fillStyle = `rgb(${INK})`; fx2d.fillRect(0,0,W,H);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const i = (y*cols + x)*4;
    const l = (a[i]*.299 + a[i+1]*.587 + a[i+2]*.114)/255;
    const r = Math.sqrt(l) * s * .55;
    if (r < .4) continue;
    fx2d.fillStyle = `rgb(${Math.min(255,a[i]*1.25)},${Math.min(255,a[i+1]*1.25)},${Math.min(255,a[i+2]*1.25)})`;
    fx2d.beginPath(); fx2d.arc(x*s + s/2, y*s + s/2, r, 0, Math.PI*2); fx2d.fill();
  }
}

/* --- WebGL(1つのキャンバスで、エフェクトごとにシェーダーを切り替える) --- */
const VS = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p*.5+.5; uv.y = 1.-uv.y; gl_Position = vec4(p,0.,1.); }`;
const HEAD = `precision mediump float; varying vec2 uv;
uniform sampler2D uTex; uniform float uTime, uAmt; uniform vec2 uMouse, uRes;`;
const SHADERS = {
  ripple:`
void main(){
  vec2 d = uv - uMouse; d.x *= uRes.x / uRes.y;
  float r = length(d);
  float wave = sin(r*40. - uTime*4.) * exp(-r*5.);
  vec2 p = uv + normalize(d + 1e-4) * wave * uAmt * .012;
  p += vec2(sin(uv.y*14. + uTime), cos(uv.x*14. + uTime*.8)) * .0015;
  gl_FragColor = texture2D(uTex, p);
}`,
  gradient:`
vec3 pal(float t){ return .5 + .5*cos(6.28318*(vec3(1.,1.,.5)*t + vec3(.8,.9,.3))); }
void main(){
  vec3 c = texture2D(uTex, uv).rgb;
  float l = dot(c, vec3(.299,.587,.114));
  float flow = sin(uv.x*3. + uTime*uAmt*.3)*.15 + cos(uv.y*4. - uTime*uAmt*.25)*.15;
  vec3 g = pal(l*.9 + flow + uTime*.02*uAmt + uMouse.x*.5);
  g *= .45 + l*1.1;
  gl_FragColor = vec4(mix(c, g, .85), 1.);
}`,
  glitch:`
float h(float x){ return fract(sin(x*127.1)*43758.5453); }
void main(){
  float amt = uAmt*.004;
  vec2 off = (uMouse - .5) * uAmt * .02;
  float band = floor(uv.y*24.), t = floor(uTime*8.);
  float g = step(.93, h(band + t*7.)) * (h(band*3. + t) - .5) * uAmt * .04;
  vec2 p = uv + vec2(g, 0.);
  float r = texture2D(uTex, p + vec2(amt,0.) + off).r;
  float gg = texture2D(uTex, p).g;
  float b = texture2D(uTex, p - vec2(amt,0.) - off).b;
  gl_FragColor = vec4(r, gg, b, 1.);
}`,
  warp:`
void main(){
  vec2 p = uv;
  float s = uAmt*.004, k = .5 + uMouse.x;
  p.x += (sin(p.y*10. + uTime*1.5)*s + sin(p.y*23. - uTime*2.1)*s*.5) * k;
  p.y += cos(p.x*9. + uTime*1.2) * s;
  gl_FragColor = texture2D(uTex, p);
}`,
  pixellens:`
void main(){
  vec2 d = uv - uMouse; d.x *= uRes.x / uRes.y;
  float k = smoothstep(.35, .0, length(d));
  float cells = mix(uRes.x, uAmt, k);
  vec2 g = vec2(cells, cells*uRes.y/uRes.x);
  gl_FragColor = texture2D(uTex, (floor(uv*g) + .5)/g);
}`
};

const glCanvas = $('fxgl');
const GL = (function(){
  const gl = glCanvas.getContext('webgl', { antialias:false });
  if (!gl) return null;
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER, gl.LINEAR],[gl.TEXTURE_MAG_FILTER, gl.LINEAR]]
    .forEach(([k,v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));
  const progs = {};
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  };
  function program(id){
    if (progs[id]) return progs[id];
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, HEAD + SHADERS[id]));
    gl.linkProgram(pr);
    const u = {}; ['uTime','uAmt','uMouse','uRes'].forEach(n => u[n] = gl.getUniformLocation(pr, n));
    return progs[id] = { pr, u, loc: gl.getAttribLocation(pr, 'p') };
  }
  let uploaded = null;
  return { draw(id, t, amt, mx, my){
    const P = program(id);
    gl.useProgram(P.pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(P.loc);
    gl.vertexAttribPointer(P.loc, 2, gl.FLOAT, false, 0, 0);
    const cv = cover();
    if (uploaded !== cv){
      try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv); uploaded = cv; }
      catch (e){ $('note').textContent = '写真を読み込めませんでした。ファイルを直接開かず、公開ページか、ローカルサーバー経由で開いてください。'; return; }
    }
    gl.viewport(0,0,W,H);
    gl.uniform1f(P.u.uTime, t); gl.uniform1f(P.u.uAmt, amt);
    gl.uniform2f(P.u.uMouse, mx, my); gl.uniform2f(P.u.uRes, W, H);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }};
})();

/* ---------- エフェクトの一覧 ---------- */
const EFFECTS = [
  { id:'dither',   name:'Dither',       ja:'ドット絵風',     kind:'2d', draw:drawDither,   desc:'写真を、2色のドットだけで表現します。',               label:'ドットの大きさ', min:3,  max:16,  step:1,  val:6 },
  { id:'ascii',    name:'ASCII',        ja:'文字で描く',     kind:'2d', draw:drawAscii,    desc:'明るさを、文字の濃さに置き換えます。',               label:'文字の大きさ',   min:8,  max:22,  step:1,  val:12 },
  { id:'halftone', name:'Halftone',     ja:'網点',           kind:'2d', draw:drawHalftone, desc:'明るさを、網点の大きさで表現します。',               label:'網点の大きさ',   min:10, max:36,  step:1,  val:18 },
  { id:'ripple',   name:'Ripple',       ja:'波紋',           kind:'gl',                    desc:'写真の上でマウスを動かすと、波紋が広がります。',     label:'波の強さ',       min:0,  max:10,  step:.5, val:5 },
  { id:'warp',     name:'Liquid Warp',  ja:'水面のゆらぎ',   kind:'gl',                    desc:'写真が、水面のようにゆらぎます。マウスの横位置で揺れ方が変わります。', label:'ゆらぎ', min:0, max:10, step:.5, val:5 },
  { id:'gradient', name:'Gradient Map', ja:'グラデーション', kind:'gl',                    desc:'写真の明るさを、流れるグラデーションに染めます。',   label:'流れる速さ',     min:0,  max:5,   step:.5, val:2 },
  { id:'glitch',   name:'RGB Glitch',   ja:'色ずれ',         kind:'gl',                    desc:'色をずらして、ときどきノイズを走らせます。',         label:'ずれの強さ',     min:0,  max:10,  step:.5, val:4 },
  { id:'pixellens',name:'Pixel Lens',   ja:'モザイクのレンズ', kind:'gl',                  desc:'マウスの周りだけが、モザイクになります。',           label:'ブロック数',     min:20, max:120, step:5,  val:50 }
];
const vals = Object.fromEntries(EFFECTS.map(e => [e.id, e.val]));
let active = EFFECTS[0];
let dirty = true, visible = true;
const mouse = { x:.5, y:.5, sx:.5, sy:.5 };
const stageBox = $('stageBox');

function selectEffect(e){
  active = e;
  document.querySelectorAll('.eff').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === e.id));
  $('effDesc').textContent = e.desc;
  $('amtLabel').textContent = e.label;
  const r = $('amt'); r.min = e.min; r.max = e.max; r.step = e.step; r.value = vals[e.id];
  $('amtOut').textContent = vals[e.id];
  $('fx2d').style.display = e.kind === '2d' ? 'block' : 'none';
  $('fxgl').style.display = e.kind === 'gl' ? 'block' : 'none';
  dirty = true;
}
function buildList(){
  const ul = $('effects');
  EFFECTS.forEach(e => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'eff'; b.dataset.id = e.id; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `${e.name}<small>${e.ja}</small>`;
    if (e.kind === 'gl' && !GL){ b.disabled = true; b.title = 'このブラウザでは使えません'; }
    b.addEventListener('click', () => selectEffect(e));
    li.appendChild(b); ul.appendChild(li);
  });
  $('amt').addEventListener('input', () => { vals[active.id] = +$('amt').value; $('amtOut').textContent = $('amt').value; dirty = true; });
  if (!GL) $('note').textContent = 'このブラウザでは WebGL が使えないため、一部のやり方は選べません。';
}

/* ---------- ベタ焼きと、赤鉛筆の丸 ---------- */
const board = $('board'), mark = $('mark');
function placeMark(redraw){
  const f = document.querySelectorAll('.frame')[photoIdx]; if (!f) return;
  const img = f.querySelector('img,canvas'); if (!img) return;
  const b = board.getBoundingClientRect(), r = img.getBoundingClientRect();
  const padX = 12, padY = 12;
  mark.style.left = (r.left - b.left - padX) + 'px';
  mark.style.top = (r.top - b.top - padY) + 'px';
  mark.style.width = (r.width + padX*2) + 'px';
  mark.style.height = (r.height + padY*2 + 16) + 'px';
  if (redraw){ mark.classList.remove('draw'); void mark.offsetWidth; mark.classList.add('draw'); }
}
function frameCanvas(p){
  const c = document.createElement('canvas'); c.width = 600; c.height = 400;
  c.getContext('2d').drawImage(p.cover, 0, 0, 600, 400);
  c.setAttribute('role','img'); c.setAttribute('aria-label', p.alt); return c;
}
function buildBoard(){
  photos.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'frame'; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', (i+1) + ' ' + p.title);
    let media;
    if (p.sample) media = frameCanvas(p);
    else { media = document.createElement('img'); media.src = p.src; media.alt = p.alt; media.loading = 'lazy'; media.width = p.img.naturalWidth; media.height = p.img.naturalHeight; }
    const no = document.createElement('span'); no.className = 'no'; no.textContent = (i+1);
    b.append(media, no);
    b.addEventListener('click', () => setPhoto(i, true));
    board.appendChild(b);
  });
}
function setPhoto(i, redraw){
  photoIdx = i; dirty = true;
  document.querySelectorAll('.frame').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  $('photoTitle').textContent = photos[i].title;
  $('photoNote').textContent = photos[i].note || '';
  $('base').getContext('2d').drawImage(cover(), 0, 0, W, H);
  placeMark(redraw);
}

/* ---------- 境目の線(ドラッグとキーボード) ---------- */
(function(){
  const handle = $('handle');
  let dragging = false;
  const setPos = pct => {
    pct = Math.max(0, Math.min(100, pct));
    stageBox.style.setProperty('--pos', pct + '%');
    handle.setAttribute('aria-valuenow', Math.round(pct));
  };
  const fromEvent = ev => { const r = stageBox.getBoundingClientRect(); setPos((ev.clientX - r.left) / r.width * 100); };
  handle.addEventListener('pointerdown', ev => { dragging = true; handle.setPointerCapture(ev.pointerId); fromEvent(ev); ev.preventDefault(); });
  handle.addEventListener('pointermove', ev => { if (dragging) fromEvent(ev); });
  const end = ev => { dragging = false; try { handle.releasePointerCapture(ev.pointerId); } catch(e){} };
  handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
  handle.addEventListener('keydown', ev => {
    const cur = +handle.getAttribute('aria-valuenow');
    if (ev.key === 'ArrowLeft'){ setPos(cur - 3); ev.preventDefault(); }
    if (ev.key === 'ArrowRight'){ setPos(cur + 3); ev.preventDefault(); }
    if (ev.key === 'Home'){ setPos(0); ev.preventDefault(); }
    if (ev.key === 'End'){ setPos(100); ev.preventDefault(); }
  });
  stageBox.addEventListener('pointermove', ev => {
    const r = stageBox.getBoundingClientRect();
    mouse.x = (ev.clientX - r.left) / r.width; mouse.y = (ev.clientY - r.top) / r.height;
  });
  stageBox.addEventListener('pointerleave', () => { mouse.x = .5; mouse.y = .5; });
})();

/* ---------- 描画ループ ---------- */
new IntersectionObserver(en => { visible = en[0].isIntersecting; if (visible) dirty = true; }).observe(stageBox);
function frame(ms){
  requestAnimationFrame(frame);
  if (!visible) return;
  mouse.sx += (mouse.x - mouse.sx) * .08;
  mouse.sy += (mouse.y - mouse.sy) * .08;
  const e = active, v = vals[e.id];
  if (e.kind === '2d'){ if (dirty){ e.draw(v); dirty = false; } }
  else if (GL){ GL.draw(e.id, reduceMotion ? 0 : ms/1000, v, mouse.sx, mouse.sy); }
}

(async function init(){
  await loadPhotos();
  buildList();
  buildBoard();
  setPhoto(0, false);
  selectEffect(EFFECTS[0]);
  new ResizeObserver(() => placeMark(false)).observe(board);
  document.querySelectorAll('.frame img').forEach(im => im.addEventListener('load', () => placeMark(false)));
  requestAnimationFrame(frame);
})();
</script>
</body>
